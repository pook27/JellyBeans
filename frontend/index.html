<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOD - גח"א</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" type="image/x-icon" href="/icon.ico">
</head>

<div id="bulk-action-bar" class="bulk-action-bar">
  <span id="bulk-count">0 Chosen</span>
  <div style="display: flex; gap: 0.5rem;">
    <button onclick="selectAllFiles()" class="btn-bulk-success">☑️ Select All</button>
    <button onclick="bulkMove()" class="btn-bulk-primary">📁 Move</button>
    <button onclick="bulkThumbnail()" class="btn-bulk-warning">🖼️ Thumbnails</button>
    <button onclick="bulkDelete()" class="btn-bulk-danger">🗑️ Delete</button>
    <button onclick="toggleSelectMode()" class="btn-bulk-cancel">Cancel</button>
  </div>
</div>

<body>
  <div class="container">
    <div class="sticky-header">
      <div class="toolbar">
        <h2>{{currentPath}}</h2>

        <div class="toolbar-actions">
          <input type="text" id="searchInput" class="search-input" placeholder="Search files..."
            oninput="filterFiles()">

          <div class="sort-controls">
            <select id="sortField" class="sort-select" onchange="applySortPreference()" title="Sort by">
              <option value="name">A–Z</option>
              <option value="date">Date</option>
              <option value="size">Size</option>
            </select>
            <button id="sortDirBtn" class="sort-dir-btn" onclick="toggleSortDir()"
              title="Toggle sort direction">↓</button>
          </div>

          <button id="jellyfinToggleBtn" onclick="toggleJellyfinTitles()"
            style="padding: 0.45rem 1.2rem; background: var(--grey-3); color: var(--black); border: none; border-radius: var(--radius-full); font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--font);">
            Titles: ❌
          </button>
          <button class="view-toggle" id="viewToggle" onclick="toggleView()" title="Switch view">
            <span id="viewIcon">☰</span>
          </button>
        </div>
      </div>

      <div id="storageBar" class="storage-bar" style="display:none;"></div>

      <form class="upload-box" id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
        <input type="hidden" name="targetPath" value="{{currentPath}}">
        <input type="text" name="customName" id="customName"
          style="display: none; flex: 1; padding: 0.4rem; border: 1px solid var(--grey-3); border-radius: var(--radius-sm);">

        <div id="dropZone" class="drop-zone" onclick="document.getElementById('fileInput').click()">
          <span class="drop-zone-icon">↑</span>
          <span class="drop-zone-label">Drop files here or <u>browse</u></span>
          <span class="drop-zone-sub" id="dropZoneStatus">No file chosen</span>
        </div>

        <input type="file" name="myFile" id="fileInput" multiple required style="display:none;">

        <button type="submit" id="submitBtn">Upload</button>
      </form>

      <div id="progressContainer" style="display: none; margin-bottom: 2rem;">
        <div style=" display: flex; flex-direction: column; align-items: center;">
          <div
            style="background: var(--grey-3); border-radius: var(--radius-full); width: 90%; height: 15px; overflow: hidden;">
            <div id="progressBar" style="background: var(--blue); width: 0%; height: 100%; transition: width 0.2s;">
            </div>
          </div>
        </div>
        <div id="progressText"
          style="text-align: center; margin-top: 0.5rem; font-size: 0.85rem; color: var(--grey-1); font-weight: bold;">
          0%</div>
      </div>
    </div>

    <div class="top-actions">
      {{topActions}}
    </div>

    <div class="grid">
      {{htmlItems}}
    </div>

  </div>

  <!-- Reusable input/confirm dialog -->
  <div id="dialogOverlay" class="overlay" style="display: none;" onclick="closeDialog(event)">
    <div class="modal dialog-modal">
      <div class="modal-header">
        <h3 id="dialogTitle">Dialog</h3>
        <button class="modal-close-btn" onclick="cancelDialog()">✕</button>
      </div>
      <div class="modal-actions" id="dialogBody">
        <!-- injected per call -->
      </div>
      <div class="modal-footer dialog-footer">
        <button id="dialogConfirmBtn" class="btn-confirm">Confirm</button>
        <button onclick="cancelDialog()" class="btn-grey">Cancel</button>
      </div>
    </div>
  </div>

  <div id="fileMenuOverlay" class="overlay" style="display: none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="menuTitle">Filename</h3>
        <button class="modal-close-btn" onclick="closeMenu()">✕</button>
      </div>
      <div class="modal-actions">

        <div id="menuInfoContent"
          style="font-size: 0.9rem; line-height: 1.8; color: var(--black); padding: 0.5rem 0 1rem 0; direction: ltr; text-align: left;">
          <i>Loading details...</i>
        </div>

        <div class="action-divider"></div>

        <div class="menu-buttons">
          <button onclick="downloadFile()" class="btn-blue">Download File</button>
          <button onclick="renameFile()" class="btn-blue">Rename</button>
          <button onclick="generateThumbnail()" class="btn-blue">Create Thumbnail</button>
          <button onclick="moveFile()" class="btn-blue">Move To...</button>
          <div class="action-divider"></div>
          <button onclick="deleteFile()" class="btn-danger" style="background: var(--danger-light);">Delete</button>
        </div>
      </div>
      <div class="modal-footer">
        <button onclick="closeMenu()" class="btn-grey">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/index.js"></script>
</body>

</html>
